<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>觀禮驗票端</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #f7f4ef, #eef3f6);
      color: #334155;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 14px 36px rgba(100, 116, 139, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #475569;
      text-align: center;
    }

    .sub {
      margin: 0 0 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      border: 1px solid #dbe3ea;
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      color: #334155;
    }

    input:focus {
      border-color: #a7c7d9;
      box-shadow: 0 0 0 4px rgba(167, 199, 217, 0.25);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 19px;
      font-weight: bold;
      color: white;
      background: #88aebf;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(136, 174, 191, 0.35);
    }

    button:active {
      transform: scale(0.98);
    }

    button.stop {
      background: #d99a8f;
      box-shadow: 0 8px 18px rgba(217, 154, 143, 0.35);
    }

    .hidden {
      display: none !important;
    }

    .scanner-page {
      width: 100%;
      min-height: 100vh;
      padding: 12px;
    }

    .scanner-wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .top-count {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 10px 24px rgba(100, 116, 139, 0.12);
    }

    .top-count span {
      display: block;
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .top-count strong {
      font-size: 34px;
      color: #475569;
    }

    .scan-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 12px 30px rgba(100, 116, 139, 0.14);
    }

    .scan-frame {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #111827;
    }

    video {
      display: block;
      width: 100%;
      height: 54vh;
      min-height: 320px;
      max-height: 520px;
      object-fit: cover;
      background: #111827;
    }

    .scan-box {
      position: absolute;
      inset: 15%;
      border: 3px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      left: 13%;
      right: 13%;
      top: 50%;
      height: 4px;
      border-radius: 99px;
      background: rgba(167, 220, 190, 0.95);
      box-shadow: 0 0 18px rgba(167, 220, 190, 0.9);
      pointer-events: none;
    }

    .main-button {
      margin-bottom: 12px;
    }

    .result-box {
      border-radius: 26px;
      padding: 22px;
      text-align: center;
      border: 3px solid transparent;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 10px 24px rgba(100, 116, 139, 0.12);
      min-height: 150px;
    }

    .result-box h2 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.2;
    }

    .result-box p {
      margin: 8px 0;
      line-height: 1.6;
      font-size: 16px;
    }

    .result-box.idle {
      border-color: #dbe3ea;
      color: #64748b;
    }

    .result-box.loading {
      background: #eef6fb;
      border-color: #a7c7d9;
      color: #3f6072;
    }

    .result-box.success {
      background: #edf8f0;
      border-color: #9fd3b0;
      color: #2f6b45;
    }

    .result-box.warning {
      background: #fff7e6;
      border-color: #e9c46a;
      color: #8a5a00;
    }

    .result-box.error {
      background: #fff0ef;
      border-color: #e9a19a;
      color: #8f3f38;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
      margin-top: 12px;
    }

    .info-grid p {
      margin: 0;
      background: rgba(255,255,255,0.72);
      padding: 12px;
      border-radius: 16px;
    }

    .info-grid b {
      display: block;
      font-size: 13px;
      opacity: 0.68;
      margin-bottom: 4px;
    }

    .info-grid span {
      display: block;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }

    .scan-notice {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: #8fbfa2;
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 17px;
      z-index: 9999;
      box-shadow: 0 10px 24px rgba(100, 116, 139, 0.25);
      pointer-events: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #475569;
      color: white;
      padding: 13px 18px;
      border-radius: 999px;
      font-size: 16px;
      z-index: 9999;
      max-width: calc(100% - 28px);
      text-align: center;
      box-shadow: 0 8px 22px rgba(100, 116, 139, 0.25);
    }

    .toast.error {
      background: #d26f65;
    }

    .toast.success {
      background: #7ab792;
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .scanner-page {
        padding: 10px;
      }

      .top-count strong {
        font-size: 32px;
      }

      video {
        height: 50vh;
        min-height: 300px;
      }

      .result-box {
        padding: 18px;
      }

      .result-box h2 {
        font-size: 30px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .info-grid span {
        font-size: 18px;
      }
    }

    @media (max-width: 380px) {
      video {
        height: 46vh;
        min-height: 270px;
      }

      .result-box h2 {
        font-size: 27px;
      }

      .top-count strong {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div id="scanNotice" class="scan-notice hidden">已掃描到 QR，驗票中...</div>

  <section id="loginPage" class="page">
    <div class="app">
      <div class="card">
        <h1>觀禮驗票端</h1>
        <p class="sub">請登入後開始掃描 QR Code</p>

        <input id="checkerPassword" type="password" placeholder="請輸入驗票密碼">
        <input id="checkerName" placeholder="驗票人員名稱，例如：入口A">

        <button onclick="loginChecker()">登入驗票端</button>
      </div>
    </div>
  </section>

  <main id="scannerPage" class="scanner-page hidden">
    <div class="scanner-wrap">

      <section class="top-count">
        <span>總入場人數</span>
        <strong id="cTotal">0 / 0</strong>
      </section>

      <button id="scanToggleBtn" class="main-button" onclick="toggleScan()">開始掃碼</button>

      <section class="scan-card">
        <div class="scan-frame">
          <video id="video" autoplay muted playsinline></video>
          <div class="scan-box"></div>
          <div class="scan-line"></div>
        </div>
      </section>

      <section id="resultBox" class="result-box idle">
        <h2>尚未開始</h2>
        <p>請按「開始掃碼」後，將 QR Code 對準掃描框。</p>
      </section>

    </div>
  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwM648_Zc1eKHjlwJYRwwgKFEskn6_1D9ynT32RVAFKCArnGxXOFKoD-S-xEU-Pv-Oj/exec";

    let CHECKER_NAME = localStorage.getItem("CHECKER_NAME") || "";
    let CHECKER_TOKEN = sessionStorage.getItem("CHECKER_TOKEN") || "";

    let codeReader = null;
    let controls = null;
    let isScanning = false;
    let scanLock = false;
    let lastCode = "";
    let lastScanTime = 0;
    let statsTimer = null;

    window.addEventListener("load", function() {
      document.getElementById("checkerName").value = CHECKER_NAME;
    });

    function loginChecker() {
      const password = document.getElementById("checkerPassword").value.trim();
      const name = document.getElementById("checkerName").value.trim() || "相機驗票端";

      if (!password) {
        toast("請輸入驗票密碼", "error");
        return;
      }

      toast("登入檢查中...");

      gasCall({
        api: "checkerLogin",
        password: password,
        checkerName: name
      }).then(function(res) {
        if (res.success) {
          CHECKER_NAME = name;
          CHECKER_TOKEN = res.token;

          localStorage.setItem("CHECKER_NAME", name);
          sessionStorage.setItem("CHECKER_TOKEN", res.token);

          document.getElementById("loginPage").classList.add("hidden");
          document.getElementById("scannerPage").classList.remove("hidden");

          toast("登入成功", "success");

          if (res.stats) {
            renderCheckerStats(res.stats);
          }

          refreshCheckerStats();

          if (statsTimer) clearInterval(statsTimer);
          statsTimer = setInterval(refreshCheckerStats, 3000);

        } else {
          toast(res.message || "驗票密碼錯誤", "error");
        }
      }).catch(function(err) {
        toast(err.message || String(err), "error");
      });
    }

    function toggleScan() {
      if (isScanning) {
        stopScan();
      } else {
        startScan();
      }
    }

    async function startScan() {
      const video = document.getElementById("video");
      const box = document.getElementById("resultBox");
      const btn = document.getElementById("scanToggleBtn");

      box.className = "result-box loading";
      box.innerHTML = `
        <h2>相機啟動中</h2>
        <p>請允許相機權限。</p>
      `;

      try {
        if (controls) {
          controls.stop();
          controls = null;
        }

        codeReader = new ZXingBrowser.BrowserQRCodeReader();

        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        controls = await codeReader.decodeFromConstraints(
          constraints,
          video,
          function(result) {
            if (!result) return;
            if (scanLock) return;

            const code = result.getText();
            const now = Date.now();

            if (!code) return;

            if (code === lastCode && now - lastScanTime < 1600) {
              return;
            }

            lastCode = code;
            lastScanTime = now;
            scanLock = true;

            showScanNotice();
            verify(code);

            setTimeout(function() {
              scanLock = false;
            }, 450);
          }
        );

        isScanning = true;
        btn.textContent = "結束掃碼";
        btn.classList.add("stop");

        box.className = "result-box idle";
        box.innerHTML = `
          <h2>等待掃描</h2>
          <p>請將 QR Code 對準掃描框。</p>
        `;

      } catch (err) {
        isScanning = false;
        btn.textContent = "開始掃碼";
        btn.classList.remove("stop");

        box.className = "result-box error";
        box.innerHTML = `
          <h2>相機啟動失敗</h2>
          <p>${esc(err.name || "")}</p>
          <p>${esc(err.message || err)}</p>
        `;
      }
    }

    function stopScan() {
      const box = document.getElementById("resultBox");
      const btn = document.getElementById("scanToggleBtn");

      if (controls) {
        controls.stop();
        controls = null;
      }

      isScanning = false;
      scanLock = false;

      btn.textContent = "開始掃碼";
      btn.classList.remove("stop");

      box.className = "result-box idle";
      box.innerHTML = `
        <h2>掃碼已停止</h2>
        <p>需要繼續驗票時，請再按「開始掃碼」。</p>
      `;
    }

    function verify(code) {
      const box = document.getElementById("resultBox");

      box.className = "result-box loading";
      box.innerHTML = `
        <h2>驗票中</h2>
        <p>${esc(code)}</p>
      `;

      gasCall({
        api: "verifyTicket",
        token: CHECKER_TOKEN,
        code: code
      }).then(function(res) {
        renderVerifyResult(res);

        if (res.stats) {
          renderCheckerStats(res.stats);
        }
      }).catch(function(err) {
        box.className = "result-box error";
        box.innerHTML = `
          <h2>驗票失敗</h2>
          <p>${esc(err.message || err || "系統發生錯誤")}</p>
        `;
      });
    }

    function renderVerifyResult(res) {
      const box = document.getElementById("resultBox");
      const t = res.ticket || {};
      const isWaitlist = t.isWaitlist || t.batch === "WAIT" || t.batchName === "現場候位";

      let cls = "error";

      if (res.result === "SUCCESS") cls = "success";
      if (res.result === "DUPLICATE") cls = "warning";
      if (res.result === "VOID") cls = "error";
      if (res.result === "AUTH_EXPIRED") cls = "error";

      box.className = "result-box " + cls;

      if (res.result === "AUTH_EXPIRED") {
        box.innerHTML = `
          <h2>登入已過期</h2>
          <p>${esc(res.message || "請重新登入")}</p>
        `;
        return;
      }

      if (res.result === "SUCCESS" && isWaitlist) {
        box.innerHTML = `
          <h2>現場候位成功</h2>
          <div class="info-grid">
            <p><b>票券類型</b><span>現場候位</span></p>
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
            <p><b>入場時間</b><span>${esc(t.checkedInAt)}</span></p>
          </div>
        `;
        return;
      }

      if (res.result === "DUPLICATE" && isWaitlist) {
        box.innerHTML = `
          <h2>候位票已驗過</h2>
          <div class="info-grid">
            <p><b>票券類型</b><span>現場候位</span></p>
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
            <p><b>原入場時間</b><span>${esc(t.checkedInAt || res.checkedInAt)}</span></p>
          </div>
        `;
        return;
      }

      if (res.result === "VOID" && isWaitlist) {
        box.innerHTML = `
          <h2>候位票已作廢</h2>
          <p>${esc(res.message)}</p>
          <div class="info-grid">
            <p><b>票券類型</b><span>現場候位</span></p>
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
          </div>
        `;
        return;
      }

      if (res.result === "SUCCESS") {
        box.innerHTML = `
          <h2>驗票成功</h2>
          <div class="info-grid">
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
            <p><b>梯次</b><span>${esc(t.batchName)}</span></p>
            <p><b>姓名</b><span>${esc(t.studentName)}</span></p>
            <p><b>學號</b><span>${esc(t.studentId)}</span></p>
            <p><b>家長票</b><span>第 ${esc(t.guestNo)} 位</span></p>
            <p><b>入場時間</b><span>${esc(t.checkedInAt)}</span></p>
          </div>
        `;
        return;
      }

      if (res.result === "DUPLICATE") {
        box.innerHTML = `
          <h2>此票已驗過</h2>
          <div class="info-grid">
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
            <p><b>梯次</b><span>${esc(t.batchName)}</span></p>
            <p><b>姓名</b><span>${esc(t.studentName)}</span></p>
            <p><b>學號</b><span>${esc(t.studentId)}</span></p>
            <p><b>原入場時間</b><span>${esc(t.checkedInAt || res.checkedInAt)}</span></p>
          </div>
        `;
        return;
      }

      if (res.result === "VOID") {
        box.innerHTML = `
          <h2>票券已作廢</h2>
          <p>${esc(res.message)}</p>
          <div class="info-grid">
            <p><b>票號</b><span>${esc(t.ticketId)}</span></p>
            <p><b>姓名</b><span>${esc(t.studentName)}</span></p>
            <p><b>學號</b><span>${esc(t.studentId)}</span></p>
          </div>
        `;
        return;
      }

      box.innerHTML = `
        <h2>無效票券</h2>
        <p>${esc(res.message || "無效票券")}</p>
        <p>原始內容：${esc(res.rawInput || "")}</p>
      `;
    }

    function refreshCheckerStats() {
      if (!CHECKER_TOKEN) return;

      gasCall({
        api: "checkerStats",
        token: CHECKER_TOKEN
      }).then(function(res) {
        if (res.success && res.stats) {
          renderCheckerStats(res.stats);
        }
      });
    }

    function renderCheckerStats(stats) {
      if (!stats) return;

      const total = stats.total || { checkedIn: 0, tickets: 0 };

      document.getElementById("cTotal").textContent =
        `${total.checkedIn} / ${total.tickets}`;
    }

    function gasCall(params) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          "gasCallback_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 100000);

        params = params || {};
        params.callback = callbackName;
        params.t = Date.now();

        const query = Object.keys(params)
          .map(function(key) {
            return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
          })
          .join("&");

        const script = document.createElement("script");
        const timer = setTimeout(function() {
          cleanup();
          reject(new Error("連線逾時，請檢查網路或 Apps Script 部署權限"));
        }, 15000);

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("無法連線到 Apps Script"));
        };

        script.src = GAS_URL + "?" + query;
        document.body.appendChild(script);

        function cleanup() {
          clearTimeout(timer);

          if (window[callbackName]) {
            delete window[callbackName];
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }
      });
    }

    function showScanNotice() {
      const notice = document.getElementById("scanNotice");

      if (!notice) return;

      notice.classList.remove("hidden");

      if (navigator.vibrate) {
        navigator.vibrate(80);
      }

      setTimeout(function() {
        notice.classList.add("hidden");
      }, 650);
    }

    function esc(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toast(message, type) {
      const old = document.querySelector(".toast");

      if (old) {
        old.remove();
      }

      const div = document.createElement("div");
      div.className = "toast " + (type || "info");
      div.textContent = message;
      document.body.appendChild(div);

      setTimeout(function() {
        div.remove();
      }, 3000);
    }
  </script>
</body>
</html>
