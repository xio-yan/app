<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身份證字號檢查碼計算器</title>

<style>
body{
    font-family: "Microsoft JhengHei", sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    text-align:center;
    width:90%;
    max-width:500px;
}

h1{
    margin-top:0;
}

.inputs{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:20px 0;
}

.inputs input{
    width:40px;
    height:50px;
    text-align:center;
    font-size:24px;
    border:2px solid #ddd;
    border-radius:8px;
    text-transform:uppercase;
}

.inputs input:focus{
    border-color:#2563eb;
    outline:none;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:#dc2626;
}
</style>
</head>
<body>

<div class="container">
    <h1>身份證字號最後一碼計算</h1>
    <p>輸入前 9 碼</p>

    <div class="inputs" id="inputs"></div>

    <button onclick="calculate()">計算最後一碼</button>

    <div class="result" id="result"></div>
</div>

<script>
const container = document.getElementById("inputs");

for(let i=0;i<9;i++){
    const input = document.createElement("input");
    input.maxLength = 1;

    input.addEventListener("input", function(){
        this.value = this.value.toUpperCase();

        if(this.value.length === 1 && this.nextElementSibling){
            this.nextElementSibling.focus();
        }

        if(i === 8){
            calculate();
        }
    });

    input.addEventListener("keydown", function(e){
        if(e.key === "Backspace" && !this.value && this.previousElementSibling){
            this.previousElementSibling.focus();
        }
    });

    container.appendChild(input);
}

function calculate(){
    const inputs = document.querySelectorAll(".inputs input");
    let id9 = "";

    inputs.forEach(input=>{
        id9 += input.value.trim().toUpperCase();
    });

    if(id9.length !== 9){
        document.getElementById("result").innerHTML = "";
        return;
    }

    const letters = {
        A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,
        I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,
        Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,
        Y:31,Z:33
    };

    const letter = id9.charAt(0);

    if(!letters[letter]){
        document.getElementById("result").innerHTML = "格式錯誤";
        return;
    }

    const code = letters[letter].toString();

    let sum =
        parseInt(code[0]) * 1 +
        parseInt(code[1]) * 9;

    const weights = [8,7,6,5,4,3,2,1];

    for(let i=1;i<9;i++){
        const n = parseInt(id9.charAt(i));

        if(isNaN(n)){
            document.getElementById("result").innerHTML = "格式錯誤";
            return;
        }

        sum += n * weights[i-1];
    }

    const checkDigit = (10 - (sum % 10)) % 10;

    document.getElementById("result").innerHTML =
        `完整身份證字號：<br><span style="color:#2563eb">${id9}${checkDigit}</span>`;
}
</script>

</body>
</html>
