<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身份證字號分析器</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
    font-family:"Microsoft JhengHei",sans-serif;
}
.container{
    width:92%;
    max-width:650px;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    text-align:center;
}
h1{margin-top:0;color:#111827}
p{color:#6b7280}
.inputs{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:25px 0;
}
.inputs input{
    width:45px;
    height:55px;
    border:2px solid #d1d5db;
    border-radius:10px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    text-transform:uppercase;
    caret-color:transparent;
}
.inputs input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}
.result{
    margin-top:25px;
    text-align:left;
}
.card{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    margin-top:15px;
}
.complete-id{
    text-align:center;
    color:#2563eb;
    font-size:32px;
    font-weight:bold;
    letter-spacing:2px;
}
.info-row{
    margin:10px 0;
    font-size:17px;
}
.label{
    font-weight:bold;
    color:#374151;
}
.error{
    color:#dc2626;
    font-weight:bold;
    text-align:center;
}
.note{
    color:#6b7280;
    font-size:14px;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="container">
    <h1>身份證字號最後一碼計算器</h1>
    <p>輸入身份證字號前 9 碼，系統會自動算出最後一碼並分析資料</p>

    <div class="inputs" id="inputs"></div>

    <div id="result" class="result"></div>
</div>

<script>
const inputBox = document.getElementById("inputs");

const areaMap = {
    A:{area:"臺北市"},
    B:{area:"臺中市"},
    C:{area:"基隆市"},
    D:{area:"臺南市"},
    E:{area:"高雄市"},
    F:{area:"新北市"},
    G:{area:"宜蘭縣"},
    H:{area:"桃園市"},
    I:{area:"嘉義市"},
    J:{area:"新竹縣"},
    K:{area:"苗栗縣"},
    M:{area:"南投縣"},
    N:{area:"彰化縣"},
    O:{area:"新竹市"},
    P:{area:"雲林縣"},
    Q:{area:"嘉義縣"},
    T:{area:"屏東縣"},
    U:{area:"花蓮縣"},
    V:{area:"臺東縣"},
    W:{area:"金門縣"},
    X:{area:"澎湖縣"},
    Z:{area:"連江縣"},
    L:{area:"臺中縣", stop:"已停用，縣市合併後改用臺中市 B"},
    R:{area:"臺南縣", stop:"已停用，縣市合併後改用臺南市 D"},
    S:{area:"高雄縣", stop:"已停用，縣市合併後改用高雄市 E"},
    Y:{area:"陽明山管理局", stop:"已停用"}
};

const letterCode = {
    A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,
    I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,
    Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,
    Y:31,Z:33
};

const thirdCodeMap = {
    "0":"在臺灣出生之本籍國民",
    "1":"在臺灣出生之本籍國民",
    "2":"在臺灣出生之本籍國民",
    "3":"在臺灣出生之本籍國民",
    "4":"在臺灣出生之本籍國民",
    "5":"在臺灣出生之本籍國民",
    "6":"入籍國民，原為外國人",
    "7":"入籍國民，原為無戶籍國民",
    "8":"入籍國民，原為香港或澳門居民",
    "9":"入籍國民，原為大陸地區居民"
};

for(let i=0;i<9;i++){
    const input = document.createElement("input");
    input.maxLength = 1;

    if(i === 0){
        input.placeholder = "A";
        input.inputMode = "text";
        input.autocapitalize = "characters";
    }else{
        input.placeholder = "0";
        input.inputMode = "numeric";
        input.pattern = "[0-9]*";
    }

    input.addEventListener("input", function(){
        if(i === 0){
            this.value = this.value.toUpperCase().replace(/[^A-Z]/g,"");
        }else if(i === 1){
            this.value = this.value.replace(/[^1-2]/g,"");
        }else{
            this.value = this.value.replace(/[^0-9]/g,"");
        }

        if(this.value && this.nextElementSibling){
            this.nextElementSibling.focus();
        }

        autoCalculate();
    });

    input.addEventListener("keydown", function(e){
        const allowKeys = ["Backspace","Delete","Tab","ArrowLeft","ArrowRight"];

        if(i === 0){
            if(!/[a-zA-Z]/.test(e.key) && !allowKeys.includes(e.key)){
                e.preventDefault();
            }
        }else if(i === 1){
            if(!/[1-2]/.test(e.key) && !allowKeys.includes(e.key)){
                e.preventDefault();
            }
        }else{
            if(!/[0-9]/.test(e.key) && !allowKeys.includes(e.key)){
                e.preventDefault();
            }
        }

        if(e.key === "Backspace" && this.value === "" && this.previousElementSibling){
            this.previousElementSibling.focus();
        }
    });

    inputBox.appendChild(input);
}

function autoCalculate(){
    const inputs = document.querySelectorAll(".inputs input");
    let id9 = "";

    inputs.forEach(input=>{
        id9 += input.value.trim().toUpperCase();
    });

    if(id9.length === 9){
        calculate(id9);
    }else{
        document.getElementById("result").innerHTML = "";
    }
}

function calculate(id9){
    const result = document.getElementById("result");

    const letter = id9[0];
    const genderCode = id9[1];
    const thirdCode = id9[2];

    if(!letterCode[letter]){
        result.innerHTML = `<div class="error">第一碼地區代碼錯誤</div>`;
        return;
    }

    if(genderCode !== "1" && genderCode !== "2"){
        result.innerHTML = `<div class="error">第二碼只能是 1 或 2</div>`;
        return;
    }

    const code = String(letterCode[letter]);

    let sum =
        parseInt(code[0]) * 1 +
        parseInt(code[1]) * 9;

    const weights = [8,7,6,5,4,3,2,1];

    for(let i=1;i<9;i++){
        sum += parseInt(id9[i]) * weights[i-1];
    }

    const checkDigit = (10 - (sum % 10)) % 10;
    const fullId = id9 + checkDigit;

    const genderText = genderCode === "1" ? "男性" : "女性";
    const areaInfo = areaMap[letter];
    const thirdText = thirdCodeMap[thirdCode];

    result.innerHTML = `
        <div class="card">
            <div class="label" style="text-align:center;">完整身份證字號</div>
            <div class="complete-id">${fullId}</div>
        </div>

        <div class="card">
            <div class="info-row">
                <span class="label">最後一碼：</span>${checkDigit}
            </div>
            <div class="info-row">
                <span class="label">報戶口地區：</span>${areaInfo.area}
            </div>
            <div class="info-row">
                <span class="label">性別：</span>${genderText}
            </div>
            <div class="info-row">
                <span class="label">第三碼判斷：</span>${thirdText}
            </div>
            ${
                areaInfo.stop
                ? `<div class="note">提醒：${letter} 代碼${areaInfo.stop}</div>`
                : ""
            }
        </div>
    `;
}
</script>

</body>
</html>
