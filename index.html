<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身份證字號檢查碼計算器</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    width:90%;
    max-width:600px;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    margin-top:0;
    color:#1f2937;
}

p{
    color:#6b7280;
}

.inputs{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:25px 0;
}

.inputs input{
    width:45px;
    height:55px;
    border:2px solid #d1d5db;
    border-radius:10px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    text-transform:uppercase;
    caret-color:transparent;
}

.inputs input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 24px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:25px;
    font-size:24px;
    font-weight:bold;
}

.complete-id{
    color:#2563eb;
    font-size:32px;
    letter-spacing:2px;
}

.error{
    color:#dc2626;
}
</style>
</head>
<body>

<div class="container">
    <h1>身份證字號最後一碼計算器</h1>
    <p>請輸入前 9 碼</p>

    <div class="inputs" id="inputs"></div>

    <button onclick="calculate()">計算最後一碼</button>

    <div id="result" class="result"></div>
</div>

<script>
const container = document.getElementById("inputs");

for(let i=0;i<9;i++){

    const input = document.createElement("input");

    input.maxLength = 1;

    if(i === 0){
        input.placeholder = "A";
        input.inputMode = "text";
        input.autocomplete = "off";
        input.autocapitalize = "characters";
    }else{
        input.placeholder = "0";
        input.inputMode = "numeric";
        input.pattern = "[0-9]*";
    }

    input.addEventListener("input", function(){

        if(i === 0){
            this.value = this.value
                .toUpperCase()
                .replace(/[^A-Z]/g,"");
        }else{
            this.value = this.value.replace(/[^0-9]/g,"");
        }

        if(this.value.length === 1 && this.nextElementSibling){
            this.nextElementSibling.focus();
        }

        autoCalculate();
    });

    input.addEventListener("keydown", function(e){

        const allowKeys = [
            "Backspace",
            "Delete",
            "Tab",
            "ArrowLeft",
            "ArrowRight"
        ];

        if(i === 0){

            if(
                !/[a-zA-Z]/.test(e.key) &&
                !allowKeys.includes(e.key)
            ){
                e.preventDefault();
            }

        }else{

            if(
                !/[0-9]/.test(e.key) &&
                !allowKeys.includes(e.key)
            ){
                e.preventDefault();
            }

        }

        if(
            e.key === "Backspace" &&
            this.value === "" &&
            this.previousElementSibling
        ){
            this.previousElementSibling.focus();
        }
    });

    container.appendChild(input);
}

function autoCalculate(){

    const inputs = document.querySelectorAll(".inputs input");

    let filled = true;

    inputs.forEach(input=>{
        if(input.value === ""){
            filled = false;
        }
    });

    if(filled){
        calculate();
    }
}

function calculate(){

    const inputs = document.querySelectorAll(".inputs input");

    let id9 = "";

    inputs.forEach(input=>{
        id9 += input.value.trim().toUpperCase();
    });

    if(id9.length !== 9){
        document.getElementById("result").innerHTML = "";
        return;
    }

    const letters = {
        A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,
        I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,
        Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,
        Y:31,Z:33
    };

    const letter = id9.charAt(0);

    if(!letters[letter]){
        document.getElementById("result").innerHTML =
            '<div class="error">第一碼必須為英文字母</div>';
        return;
    }

    const code = letters[letter].toString();

    let sum =
        parseInt(code[0]) * 1 +
        parseInt(code[1]) * 9;

    const weights = [8,7,6,5,4,3,2,1];

    for(let i=1;i<9;i++){

        const num = parseInt(id9.charAt(i));

        if(isNaN(num)){
            document.getElementById("result").innerHTML =
                '<div class="error">格式錯誤</div>';
            return;
        }

        sum += num * weights[i-1];
    }

    const checkDigit = (10 - (sum % 10)) % 10;

    document.getElementById("result").innerHTML = `
        <div>完整身份證字號</div>
        <div class="complete-id">${id9}${checkDigit}</div>
    `;
}
</script>

</body>
</html>
